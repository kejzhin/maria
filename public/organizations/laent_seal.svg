<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Arc paths for text -->
    <path id="top-arc" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <path id="bottom-arc" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
  </defs>

  <!-- Outer Navy Circle -->
  <circle cx="250" cy="250" r="240" fill="#0d1f4d" stroke="#ffffff" stroke-width="8" />
  <circle cx="250" cy="250" r="195" fill="#ffffff" stroke="#0d1f4d" stroke-width="6" />

  <!-- Top Text: LOS ANGELES CENTER FOR -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      LOS ANGELES CENTER FOR
    </textPath>
  </text>

  <!-- Bottom Text: EAR, NOSE, THROAT AND ALLERGY -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="23" letter-spacing="3">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      EAR, NOSE, THROAT AND ALLERGY
    </textPath>
  </text>

  <!-- Central Inner Circle with White background -->
  <circle cx="250" cy="250" r="192" fill="#ffffff" />

  <!-- The X intersecting lines -->
  <line x1="114" y1="114" x2="386" y2="386" stroke="#0d1f4d" stroke-width="7" />
  <line x1="386" y1="114" x2="114" y2="386" stroke="#0d1f4d" stroke-width="7" />

  <!-- TOP QUADRANT: LA Skyline -->
  <g fill="#0d1f4d">
    <!-- City Skyline Silhouette in upper triangle -->
    <path d="M 180,210 L 180,185 L 195,185 L 195,170 L 205,170 L 205,155 L 218,155 L 218,175 L 230,175 L 230,135 L 238,135 L 238,125 L 244,115 L 250,110 L 256,115 L 262,125 L 262,135 L 270,135 L 270,150 L 285,150 L 285,165 L 295,165 L 295,190 L 310,190 L 310,210 Z" />
    <rect x="247" y="90" width="6" height="25" />
  </g>

  <!-- LEFT QUADRANT: Ear Icon -->
  <g fill="#0d1f4d" transform="translate(130, 210) scale(1.1)">
    <path d="M35 5 C15 5, 0 20, 0 45 C0 70, 15 90, 35 105 C40 108, 48 102, 45 95 C40 85, 32 75, 32 60 C32 45, 42 35, 48 25 C50 20, 45 10, 35 5 Z" />
    <path d="M28 35 C20 40, 16 50, 18 60 C20 70, 28 75, 32 75 C35 75, 36 70, 34 65 C30 55, 26 45, 30 38 C32 35, 30 32, 28 35 Z" fill="#ffffff" />
  </g>

  <!-- RIGHT QUADRANT: Head/Throat Silhouette -->
  <g fill="#0d1f4d" transform="translate(305, 215) scale(0.95)">
    <path d="M 40,5 C 20,5 5,20 5,40 C 5,55 15,68 28,73 L 28,95 L 45,95 L 45,85 L 55,85 C 65,85 70,75 70,60 L 60,60 C 55,60 50,55 50,45 C 50,30 65,25 65,15 C 60,5 50,5 40,5 Z" />
    <circle cx="28" cy="40" r="5" fill="#ffffff" />
    <path d="M 32,60 C 35,68 45,70 52,65" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- BOTTOM QUADRANT: Nose Silhouette -->
  <g fill="#0d1f4d" transform="translate(225, 290) scale(1)">
    <path d="M 25,10 C 20,35 15,60 5,75 C -2,85 10,95 25,95 C 40,95 52,85 45,75 C 35,60 30,35 25,10 Z" />
    <ellipse cx="14" cy="85" rx="5" ry="3" fill="#ffffff" />
    <ellipse cx="36" cy="85" rx="5" ry="3" fill="#ffffff" />
  </g>
</svg>
