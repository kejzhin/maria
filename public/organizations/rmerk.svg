<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer circle border -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#111111" stroke-width="12" />

  <!-- Orbital Ellipse 1 (Red, tilted -45 deg) -->
  <g transform="translate(200,200) rotate(-45)">
    <ellipse cx="0" cy="0" rx="145" ry="55" fill="none" stroke="#d91e18" stroke-width="14" />
  </g>

  <!-- Orbital Ellipse 2 (Blue, tilted 45 deg) -->
  <g transform="translate(200,200) rotate(45)">
    <ellipse cx="0" cy="0" rx="145" ry="55" fill="none" stroke="#0033cc" stroke-width="14" />
  </g>

  <!-- Green Nucleus Circle in Center -->
  <circle cx="200" cy="200" r="42" fill="#1dd13b" />

  <!-- Center Text: R-MERK -->
  <text x="200" y="215" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#055e1b" stroke="#000000" stroke-width="2" letter-spacing="2">
    R-MERK
  </text>
</svg>
